id: uk-hpi-property-type
kind: csv
location: "https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data/Average-prices-Property-Type-{ym}.csv"
resolve:
  ym: { kind: month, layout: "2006-01", start: "-1m", back: 6 }
csv: { header: true, encoding: utf-8 }
table:
  - unpivot:
      id: [Date, Region_Name, Area_Code]
      columns:
        Detached_Average_Price: detached
        Semi_Detached_Average_Price: semi_detached
        Terraced_Average_Price: terraced
        Flat_Average_Price: flat
      name: property_type
      value: value
natural_key: [Area_Code, Date, property_type]
schedule: { every: monthly, day_of_month: 20, at: "10:00", timezone: Europe/London, on_missed: run_once }
change_detection: [etag, last_modified, content_hash]
