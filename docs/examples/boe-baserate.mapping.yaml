source: boe-bank-rate
version: 1
fields:
  series_id:
    from: "@ctx.series_name"
    map:
      "Bank Rate": BOE_BANK_RATE
      "Min Lending Rate": BOE_MIN_LENDING_RATE
      "Min.Band 1 Dealing Rate": BOE_MIN_BAND1_DEALING_RATE
      "Repo Rate": BOE_REPO_RATE
      "Official Bank Rate": BOE_OFFICIAL_BANK_RATE
    required: true
  series_title: { from: "@ctx.series_name" }
  measure:      { const: bank_rate }
  # 17 early events have no day (e.g. Oct 1694): the second layout gives them month precision.
  # Inputs are joined (empty ones skipped) in the order listed, so list them in layout order.
  period_type:  { from: [day, month, year], type: period, format: ["2 Jan 2006", "Jan 2006"], output: period_type }
  period_start: { from: [day, month, year], type: period, format: ["2 Jan 2006", "Jan 2006"], output: period_start }
  period_end:   { from: [day, month, year], type: period, format: ["2 Jan 2006", "Jan 2006"], output: period_end }
  value:        { from: rate, type: decimal, required: true }
  unit:         { const: "%" }
extra: keep
dimensions:
  rate_type: { from: "@ctx.series_name" }
